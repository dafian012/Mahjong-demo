[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/register"
  to = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

[[redirects]]
  from = "/api/telegram"
  to = "/.netlify/functions/telegram"
  status = 200
